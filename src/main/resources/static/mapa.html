<script>
    var map; // Variable global para el mapa
      var markers = []; // Array para almacenar los marcadores

    // Array con las ubicaciones (coordenadas) de los marcadores
    var locations = [
      { lat: -30.874725, lng: -58.6514129, title: "Marker 1" },
      { lat: -30.874118, lng: -58.6514701, title: "Marker 2" },
      { lat: -30.874011, lng: -58.6514919, title: "Marker 3" }
    ];

    function initMap() {
        // Crear el mapa con un valor de zoom inicial
        map = new google.maps.Map(document.getElementById('map'), {
          zoom: 8,
          center: locations[0] // Centro inicial (puedes centrarlo en cualquier lugar)
        });

        // Crear el objeto LatLngBounds para ajustar los límites del mapa
        var bounds = new google.maps.LatLngBounds();

        // Crear marcadores para cada ubicación
        locations.forEach(function(location) {
          var marker = new google.maps.Marker({
            position: { lat: location.lat, lng: location.lng },
            map: map,
            title: location.title
          });

          markers.push(marker); // Almacenar los marcadores en el array

          // Añadir la posición del marcador a los límites
          bounds.extend(marker.position);
        });

        // Ajustar el mapa para que muestre todos los marcadores dentro de los límites
        map.fitBounds(bounds);
      }
</script>


<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCut-_TSF22MAjQsPkAF6dh6G9DqSaFfXw&loading=async&callback=initMap"></script>

</body>
